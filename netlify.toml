[build]
  command = "npm run build"
  publish = "dist"

# ============================================================
# NAPR-ის რუკების proxy
#
# საჯარო რეესტრის სერვისები მხოლოდ http-ზე მუშაობს, საიტი კი https-ია.
# ბრაუზერი https გვერდზე http-სურათებს ბლოკავს (mixed content).
# ამიტომ ტაილებს Netlify-ს გავატარებთ — ბრაუზერისთვის ისინი
# იმავე დომენიდან, https-ით მოდის.
#
# ⚠️ ეს წესები SPA-ს catch-all-ზე ზემოთ უნდა იყოს.
# ============================================================

# საჯარო რეესტრის ნაკვეთების WFS (SLRWFS:LR_PARCELS_38) — კოდით ძებნისთვის.
# ბრაუზერი NAPR-ს პირდაპირ ვერ მიმართავს (CORS), ამიტომ Netlify-ით მივდივართ.
# რომელი მისამართი პასუხობს, ზუსტად უცნობია — საიტი რიგრიგობით ცდის
# (src/lib/napr.js → PARCEL_WFS_LIST) და მომუშავეს იმახსოვრებს.
[[redirects]]
  from = "/napr/wfs1"
  to = "https://nv.napr.gov.ge/geoserver/wfs"
  status = 200
  force = true

[[redirects]]
  from = "/napr/wfs2"
  to = "https://nv.napr.gov.ge/geoserver/SLRWFS/wfs"
  status = 200
  force = true

[[redirects]]
  from = "/napr/wfs3"
  to = "http://nv.napr.gov.ge/geoserver/wfs"
  status = 200
  force = true

[[redirects]]
  from = "/napr/wfs4"
  to = "http://nv.napr.gov.ge/geoserver/SLRWFS/wfs"
  status = 200
  force = true

[[redirects]]
  from = "/napr-tiles/*"
  to = "http://mp1.napr.gov.ge/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/napr-wms/*"
  to = "http://gpv0.napr.gov.ge/:splat"
  status = 200
  force = true

# SPA — ყოველთვის ბოლოს
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
