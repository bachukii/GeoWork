[build]
  command = "npm run build"
  publish = "dist"

# ============================================================
# საჯარო რეესტრი (NAPR)
#
# რუკის ფენები (ნაკვეთები NG_REG_LAYER, ორთოფოტო WBR) ბრაუზერში პირდაპირ
# იტვირთება (src/lib/basemaps.js) — სურათებზე CORS არ მოქმედებს.
# fetch-ით წაკითხვას კი CORS სჭირდება, ამიტომ ეს მოთხოვნები აქედან გადის.
# ⚠️ ეს წესები SPA-ს catch-all-ზე ზემოთ უნდა იყოს.
# ============================================================

# ნაკვეთის ძებნა კოდით — Netlify Function (netlify/functions/napr-wfs.mjs).
# NAPR-ის WFS პაროლს ითხოვს; ის არა აქ, არამედ Netlify-ის
# Environment variables-შია: NAPR_WFS_AUTH = "მომხმარებელი:პაროლი".
[[redirects]]
  from = "/napr/wfs"
  to = "/.netlify/functions/napr-wfs"
  status = 200
  force = true

# ნაკვეთზე დაჭერა რუკაზე — საკადასტრო WMS GetFeatureInfo
[[redirects]]
  from = "/napr/cad"
  to = "https://nv.napr.gov.ge/geoserver/wms"
  status = 200
  force = true

# SPA — ყოველთვის ბოლოს
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
